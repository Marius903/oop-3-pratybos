<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oop 3 pratybos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #555, #292929);
            font-family: Arial, sans-serif;
            color: white;
            padding: 25px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            font-size: 17px;
            color: #ddd;
            margin-bottom: 30px;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .category-btn {
            background: #272335;
            color: white;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 13px 35px;
            cursor: pointer;
            transition: 0.2s;
        }

        .category-btn:hover {
            background: #49435d;
        }

        .category-btn.active {
            border-color: #5898ff;
            background: #393447;
        }

        .form-container {
            background: #393447;
            max-width: 380px;
            margin: auto;
            padding: 22px;
            border-radius: 12px;
            text-align: center;
        }

        .form-container h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        #form-fields {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .field-group label {
            font-size: 13px;
        }

        .field-group input,
        .field-group select {
            width: 100%;
            height: 32px;
            border: none;
            border-radius: 3px;
            padding: 5px 8px;
            background: white;
            color: #222;
            outline: none;
        }

        .field-group input:focus,
        .field-group select:focus {
            box-shadow: 0 0 0 2px #5898ff;
        }

        .submit-btn {
            margin-top: 18px;
            padding: 12px 25px;
            background: #211e2d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #5898ff;
        }

        #message {
            margin-top: 12px;
            font-size: 14px;
            min-height: 17px;
        }

        .success {
            color: #75e69b;
        }

        .error {
            color: #ff7777;
        }

        .animals-section {
            margin-top: 30px;
        }

        .animals-section h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .animals-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
        }

        .animal-card {
            background: #393447;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0003;
        }

        .animal-card h3 {
            margin-bottom: 10px;
        }

        .animal-card p {
            font-size: 14px;
            margin: 6px 0;
            color: #e3e0eb;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 10px;
            background: #236b45;
            border-radius: 6px;
            font-size: 12px;
        }

        .status.given {
            background: #875c32;
        }

        .card-actions {
            display: flex;
            gap: 7px;
            margin-top: 13px;
        }

        .card-actions button {
            flex: 1;
            padding: 9px 5px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .give-btn {
            background: #397b57;
        }

        .return-btn {
            background: #555071;
        }

        .delete-btn {
            background: #a34747;
        }

        .empty-message {
            text-align: center;
            color: #ccc;
            padding: 25px;
            background: #393447;
            border-radius: 10px;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #aaa;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .categories {
                gap: 7px;
                flex-wrap: wrap;
            }

            .category-btn {
                padding: 11px 19px;
            }

            .animals-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="categories">

        <button class="category-btn active" data-category="cats">
            Cats
        </button>

        <button class="category-btn" data-category="fish">
            Fish
        </button>

        <button class="category-btn" data-category="birds">
            Birds
        </button>

    </nav>

    <section class="form-container">

        <h2 id="form-title">Katino registracija</h2>

        <form id="animal-form">

            <div id="form-fields"></div>

            <button type="submit" class="submit-btn">
                Submit
            </button>

        </form>

        <p id="message"></p>

    </section>

    <section class="animals-section">

        <h2 id="list-title">Užregistruoti katinai</h2>

        <div id="animals-list" class="animals-list">

            <p class="empty-message">
                Kol kas gyvūnų nėra.
            </p>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
